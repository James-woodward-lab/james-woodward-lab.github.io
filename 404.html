<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not found — James Woodward Lab</title>
  <script>
    (function () {
      var path = location.pathname || ''
      // SPA deep-link support for Broker 360 at /brokerapp
      if (path === '/brokerapp' || path.indexOf('/brokerapp/') === 0) {
        var rest = path.slice('/brokerapp'.length) || '/'
        sessionStorage.setItem(
          'brokerapp-redirect',
          rest + location.search + location.hash
        )
        location.replace('/brokerapp/')
        return
      }
    })()
  </script>
  <link rel="stylesheet" href="/css/app-theme.css" />
</head>
<body>
  <main style="max-width: 36rem; margin: 4rem auto; padding: 1.5rem; font-family: system-ui, sans-serif">
    <h1>Page not found</h1>
    <p>That path doesn’t exist on James Woodward Lab.</p>
    <p><a href="/">← Back to home</a></p>
  </main>
</body>
</html>
